name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run check
      - name: Unit tests
        run: npm run test
      - name: Content validation
        run: npm run validate:content
      - name: Build (static)
        run: npm run build:static
        env:
          SITE_URL: ${{ vars.SITE_URL }}
