<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" preserveAspectRatio="xMidYMid slice" shape-rendering="crispEdges">
<style>
    @keyframes w1 { 0% { transform: translateX(0) } 25% { transform: translateX(-14px) } 50% { transform: translateX(-28px) } 75% { transform: translateX(-40px) } 100% { transform: translateX(-52px) } }
    @keyframes w2 { 0% { transform: translateX(-44px) } 25% { transform: translateX(-30px) } 50% { transform: translateX(-14px) } 75% { transform: translateX(0px) } 100% { transform: translateX(12px) } }
    @keyframes cf1 { from { transform: translateX(0) } to { transform: translateX(-80px) } }
    @keyframes cf2 { from { transform: translateX(-68px) } to { transform: translateX(20px) } }
    @keyframes bf1 { from { transform: translate(0, 0) } to { transform: translate(28px, -12px) } }
    @keyframes bf2 { from { transform: translate(20px, -12px) } to { transform: translate(0, 0) } }
    @keyframes scarf { from { transform: rotate(-3deg) translateX(0) } to { transform: rotate(3deg) translateX(4px) } }
    @keyframes wing { 0%, 100% { opacity: 1 } 50% { opacity: .15 } }
    @keyframes bfly1 { 0% { transform: translate(0, 0) } 25% { transform: translate(12px, -10px) } 50% { transform: translate(24px, 0) } 75% { transform: translate(12px, 10px) } 100% { transform: translate(0, 0) } }
    @keyframes bfly2 { 0% { transform: translate(0, 0) } 25% { transform: translate(-10px, -8px) } 50% { transform: translate(-20px, 0) } 75% { transform: translate(-10px, 8px) } 100% { transform: translate(0, 0) } }
    .w1 { animation: w1 3.6s ease-in-out infinite alternate }
    .w2 { animation: w2 4.4s ease-in-out infinite alternate }
    .cf1 { animation: cf1 26s linear infinite }
    .cf2 { animation: cf2 30s linear infinite }
    .bf1 { animation: bf1 2.8s ease-in-out infinite alternate }
    .bf2 { animation: bf2 3.2s ease-in-out infinite alternate }
    .scarf { animation: scarf 3s ease-in-out infinite alternate; transform-origin: 370px 170px; transform-box: fill-box }
    .wing { animation: wing .5s steps(1) infinite }
    .bfly1 { animation: bfly1 4s ease-in-out infinite }
    .bfly2 { animation: bfly2 5s ease-in-out infinite 1s }
  </style>
<g class="bf1"><rect x="300.00" y="64.00" width="8.00" height="4.00" class="bf1" fill="#8A6B3F"/>
<rect x="240.00" y="104.00" width="8.00" height="4.00" class="bf1" fill="#8A6B3F"/></g>
<g class="bf2"><rect x="316.00" y="56.00" width="8.00" height="4.00" class="bf2" fill="#8A6B3F"/>
<rect x="492.00" y="76.00" width="8.00" height="4.00" class="bf2" fill="#8A6B3F"/></g>
<g class="wing"><rect x="192.00" y="156.00" width="4.00" height="4.00" class="wing" fill="#E8922E"/>
<rect x="196.00" y="156.00" width="4.00" height="4.00" class="wing" fill="#C86A1E"/>
<rect x="280.00" y="132.00" width="4.00" height="4.00" class="wing" fill="#7A6AB8"/>
<rect x="284.00" y="132.00" width="4.00" height="4.00" class="wing" fill="#5A4A96"/></g>
<g class="bfly1"><g class="bfly1"><rect x="194.00" y="158.00" width="2.00" height="2.00" fill="#5A3A1A"/></g></g>
<g class="bfly2"><g class="bfly2"><rect x="282.00" y="134.00" width="2.00" height="2.00" fill="#3A2A5A"/></g></g>
</svg>