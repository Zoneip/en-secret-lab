<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" preserveAspectRatio="xMidYMid slice" shape-rendering="crispEdges">
<style>
    @keyframes s1 { from { transform: translateX(0) } to { transform: translateX(-72px) } }
    @keyframes s2 { from { transform: translateX(-60px) } to { transform: translateX(16px) } }
    @keyframes f1 { from { transform: translateX(0); opacity: .4 } 50% { opacity: .85 } to { transform: translateX(-72px); opacity: .4 } }
    @keyframes f2 { from { transform: translateX(-60px); opacity: .7 } 50% { opacity: .35 } to { transform: translateX(16px); opacity: .7 } }
    @keyframes mp0 { 0%, 100% { opacity: .3 } 50% { opacity: .8 } }
    @keyframes mp1 { 0%, 100% { opacity: .7 } 50% { opacity: .25 } }
    @keyframes halo { 0%, 100% { opacity: .6 } 50% { opacity: .95 } }
    @keyframes sway { from { transform: rotate(-0.4deg) } 50% { transform: rotate(0.4deg) } to { transform: rotate(-0.4deg) } }
    @keyframes sleeveL { from { transform: rotate(0deg) translateX(0) } 50% { transform: rotate(-4deg) translateX(-2px) } to { transform: rotate(0deg) translateX(0) } }
    @keyframes sleeveR { from { transform: rotate(0deg) translateX(0) } 50% { transform: rotate(4deg) translateX(2px) } to { transform: rotate(0deg) translateX(0) } }
    @keyframes lantern { 0%, 100% { opacity: .55 } 50% { opacity: 1 } }
    @keyframes lhalo { 0%, 100% { opacity: .14 } 50% { opacity: .5 } }
    @keyframes lhalo2 { 0%, 100% { opacity: .08 } 50% { opacity: .3 } }
    @keyframes tw0 { 0%, 55% { opacity: 1 } 56%, 100% { opacity: .2 } }
    @keyframes tw1 { 0%, 40% { opacity: .2 } 41%, 100% { opacity: 1 } }
    @keyframes tw2 { 0%, 65% { opacity: 1 } 66%, 100% { opacity: .25 } }
    @keyframes shoot { from { transform: translate(0, 0); opacity: 1 } to { transform: translate(-60px, 36px); opacity: 0 } }
    @keyframes pt0 { 0% { transform: translate(0, 0) rotate(0deg); opacity: 0 } 8% { opacity: .9 } 30% { transform: translate(-20px, 44px) rotate(60deg) } 55% { transform: translate(-8px, 88px) rotate(120deg) } 80% { transform: translate(-24px, 140px) rotate(200deg); opacity: .8 } 100% { transform: translate(-12px, 192px) rotate(260deg); opacity: 0 } }
    @keyframes pt1 { 0% { transform: translate(0, 0) rotate(0deg); opacity: 0 } 10% { opacity: .85 } 35% { transform: translate(18px, 40px) rotate(-70deg) } 60% { transform: translate(6px, 84px) rotate(-140deg) } 85% { transform: translate(20px, 136px) rotate(-210deg); opacity: .7 } 100% { transform: translate(8px, 184px) rotate(-280deg); opacity: 0 } }
    @keyframes pt2 { 0% { transform: translate(0, 0) rotate(0deg); opacity: 0 } 12% { opacity: .8 } 40% { transform: translate(-12px, 52px) rotate(90deg) } 65% { transform: translate(10px, 100px) rotate(180deg) } 90% { transform: translate(-16px, 152px) rotate(270deg); opacity: .6 } 100% { transform: translate(0, 200px) rotate(340deg); opacity: 0 } }
    @keyframes pt3 { 0% { transform: translate(0, 0) rotate(0deg); opacity: 0 } 15% { opacity: .85 } 45% { transform: translate(14px, 48px) rotate(-100deg) } 70% { transform: translate(-8px, 96px) rotate(-200deg) } 100% { transform: translate(12px, 180px) rotate(-300deg); opacity: 0 } }
    @keyframes pf0 { 0% { transform: translate(0, 0); opacity: 0 } 10% { opacity: .85 } 50% { transform: translate(-28px, 80px) rotate(120deg) } 100% { transform: translate(-20px, 220px) rotate(240deg); opacity: 0 } }
    @keyframes pf1 { 0% { transform: translate(0, 0); opacity: 0 } 12% { opacity: .8 } 55% { transform: translate(24px, 88px) rotate(-140deg) } 100% { transform: translate(16px, 224px) rotate(-280deg); opacity: 0 } }
    @keyframes bg0 { 0% { transform: translate(0, 0); opacity: .3 } 50% { transform: translate(-12px, -20px); opacity: 1 } 100% { transform: translate(0, 0); opacity: .3 } }
    @keyframes bg1 { 0% { transform: translate(0, 0); opacity: .6 } 50% { transform: translate(10px, -16px); opacity: .25 } 100% { transform: translate(0, 0); opacity: .6 } }
    @keyframes bg2 { 0% { transform: translate(0, 0); opacity: .4 } 50% { transform: translate(-8px, -24px); opacity: .9 } 100% { transform: translate(0, 0); opacity: .4 } }
    @keyframes bg3 { 0% { transform: translate(0, 0); opacity: .5 } 50% { transform: translate(12px, -18px); opacity: .3 } 100% { transform: translate(0, 0); opacity: .5 } }
    .s1 { animation: s1 10s linear infinite }
    .s2 { animation: s2 12s linear infinite }
    .f1 { animation: f1 10s linear infinite }
    .f2 { animation: f2 12s linear infinite }
    .mp0 { animation: mp0 3.4s ease-in-out infinite }
    .mp1 { animation: mp1 4.2s ease-in-out infinite }
    .halo { animation: halo 4.5s ease-in-out infinite }
    .sway { animation: sway 8s ease-in-out infinite; transform-origin: 320px 300px; transform-box: fill-box }
    .sleeveL { animation: sleeveL 4.2s ease-in-out infinite; transform-origin: 390px 248px; transform-box: fill-box }
    .sleeveR { animation: sleeveR 4.2s ease-in-out infinite .6s; transform-origin: 418px 248px; transform-box: fill-box }
    .lantern { animation: lantern 1.6s steps(1) infinite }
    .lhalo { animation: lhalo 2.8s ease-in-out infinite }
    .lhalo2 { animation: lhalo2 3.6s ease-in-out infinite 0.8s }
    .tw0 { animation: tw0 2.4s steps(1) infinite }
    .tw1 { animation: tw1 3s steps(1) infinite }
    .tw2 { animation: tw2 2s steps(1) infinite }
    .shoot { animation: shoot 7s linear infinite }
    .pt0 { animation: pt0 7s linear infinite }
    .pt1 { animation: pt1 8.5s linear infinite 1.2s }
    .pt2 { animation: pt2 9.5s linear infinite 2.4s }
    .pt3 { animation: pt3 10.5s linear infinite .8s }
    .pf0 { animation: pf0 6.5s linear infinite 1.8s }
    .pf1 { animation: pf1 7.5s linear infinite 3s }
    .bg0 { animation: bg0 6s ease-in-out infinite }
    .bg1 { animation: bg1 7.5s ease-in-out infinite 1s }
    .bg2 { animation: bg2 6.8s ease-in-out infinite 2s }
    .bg3 { animation: bg3 8s ease-in-out infinite .5s }
    .moonp { animation: lantern 6s ease-in-out infinite }
  </style>
