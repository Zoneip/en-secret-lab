<rect x="322.00" y="112.00" width="2.00" height="2.00" class="tw1" fill="#B9A6F5"/></g>
<g class="tw2"><rect x="174.00" y="88.00" width="2.00" height="2.00" class="tw2" fill="#B9A6F5"/>
<rect x="396.00" y="64.00" width="2.00" height="2.00" class="tw2" fill="#B9A6F5"/></g>
<g class="mbeam"><rect x="264.00" y="304.00" width="112.00" height="16.00" fill="#C9B9F7" opacity="0.26" class="mbeam"/>
<g class="mbeam"><rect x="272.00" y="220.00" width="96.00" height="112.00" fill="#B9A6F5" opacity="0.28"/><rect x="308.00" y="220.00" width="28.00" height="112.00" fill="#C9B9F7" opacity="0.36"/><rect x="292.00" y="224.00" width="56.00" height="108.00" fill="#A78BFA" opacity="0.16"/></g></g>
</svg>