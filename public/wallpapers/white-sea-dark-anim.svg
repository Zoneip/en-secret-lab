<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" preserveAspectRatio="xMidYMid slice" shape-rendering="crispEdges">
<style>
    @keyframes s1 { from { transform: translateX(0) } to { transform: translateX(-72px) } }
    @keyframes s2 { from { transform: translateX(-60px) } to { transform: translateX(16px) } }
    @keyframes f1 { from { transform: translateX(0); opacity: .4 } 50% { opacity: .9 } to { transform: translateX(-72px); opacity: .4 } }
    @keyframes f2 { from { transform: translateX(-60px); opacity: .7 } 50% { opacity: .35 } to { transform: translateX(16px); opacity: .7 } }
    @keyframes lantern { 0%, 100% { opacity: 1 } 50% { opacity: .35 } }
    @keyframes sweep { from { transform: rotate(0deg) } to { transform: rotate(360deg) } }
    @keyframes mp0 { 0%, 100% { opacity: .3 } 25% { opacity: .55 } 50% { opacity: .8 } 75% { opacity: .5 } }
    @keyframes mp1 { 0%, 100% { opacity: .7 } 25% { opacity: .45 } 50% { opacity: .25 } 75% { opacity: .5 } }
    @keyframes warm { 0%, 100% { opacity: .5 } 50% { opacity: 1 } }
    @keyframes tw0 { 0%, 55% { opacity: 1 } 56%, 100% { opacity: .2 } }
    @keyframes tw1 { 0%, 40% { opacity: .2 } 41%, 100% { opacity: 1 } }
    @keyframes tw2 { 0%, 65% { opacity: 1 } 66%, 100% { opacity: .25 } }
    @keyframes jelly0 { 0% { transform: translate(0, 0); opacity: .5 } 25% { transform: translate(0, -14px); opacity: .8 } 50% { transform: translate(0, -28px); opacity: 1 } 75% { transform: translate(0, -14px); opacity: .75 } 100% { transform: translate(0, 0); opacity: .5 } }
    @keyframes jelly1 { 0% { transform: translate(0, 0); opacity: .7 } 25% { transform: translate(0, -10px); opacity: .5 } 50% { transform: translate(0, -20px); opacity: .35 } 75% { transform: translate(0, -10px); opacity: .55 } 100% { transform: translate(0, 0); opacity: .7 } }
    @keyframes jelly2 { 0% { transform: translate(0, 0); opacity: .4 } 25% { transform: translate(0, -16px); opacity: .75 } 50% { transform: translate(0, -32px); opacity: 1 } 75% { transform: translate(0, -16px); opacity: .7 } 100% { transform: translate(0, 0); opacity: .4 } }
    @keyframes jglow { 0%, 100% { opacity: .4 } 50% { opacity: .95 } }
    .s1 { animation: s1 10s linear infinite }
    .s2 { animation: s2 12s linear infinite }
    .f1 { animation: f1 10s linear infinite }
    .f2 { animation: f2 12s linear infinite }
    .lantern { animation: lantern 1.8s steps(1) infinite }
    .sweep { animation: sweep 8s linear infinite; transform-origin: 64px 198px; transform-box: fill-box }
    .mp0 { animation: mp0 3.4s ease-in-out infinite }
    .mp1 { animation: mp1 4.2s ease-in-out infinite }
    .warm { animation: warm 2.6s ease-in-out infinite }
    .tw0 { animation: tw0 2.4s steps(1) infinite }
    .tw1 { animation: tw1 3s steps(1) infinite }
    .tw2 { animation: tw2 2s steps(1) infinite }
    .jelly0 { animation: jelly0 7s ease-in-out infinite }
    .jelly1 { animation: jelly1 8.5s ease-in-out infinite 1.5s }
    .jelly2 { animation: jelly2 6.5s ease-in-out infinite 3s }
    .jglow { animation: jglow 2.4s ease-in-out infinite }
    .moonp { animation: lantern 6s ease-in-out infinite }
  </style>
