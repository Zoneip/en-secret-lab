<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" shape-rendering="crispEdges">
<style>
    @keyframes w1 { 0% { transform: translateX(0) } 25% { transform: translateX(-14px) } 50% { transform: translateX(-28px) } 75% { transform: translateX(-40px) } 100% { transform: translateX(-52px) } }
    @keyframes w2 { 0% { transform: translateX(-44px) } 25% { transform: translateX(-30px) } 50% { transform: translateX(-14px) } 75% { transform: translateX(0px) } 100% { transform: translateX(12px) } }
    @keyframes cf1 { from { transform: translateX(0) } to { transform: translateX(-80px) } }
    @keyframes cf2 { from { transform: translateX(-68px) } to { transform: translateX(20px) } }
