<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" shape-rendering="crispEdges">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" shape-rendering="crispEdges">
<style>
    @keyframes s1 { from { transform: translateX(0) } to { transform: translateX(-80px) } }
    @keyframes s2 { from { transform: translateX(-68px) } to { transform: translateX(16px) } }
    @keyframes f1 { from { transform: translateX(0); opacity: .95 } 50% { opacity: .6 } to { transform: translateX(-80px); opacity: .95 } }
    @keyframes f2 { from { transform: translateX(-68px); opacity: .75 } 50% { opacity: 1 } to { transform: translateX(16px); opacity: .75 } }
    @keyframes boat { 0% { transform: rotate(-2.5deg) translateY(0) } 25% { transform: rotate(-1deg) translateY(2px) } 50% { transform: rotate(2.5deg) translateY(2px) } 75% { transform: rotate(1deg) translateY(0) } 100% { transform: rotate(-2.5deg) translateY(0) } }
    @keyframes cf1 { from { transform: translateX(0) } to { transform: translateX(-80px) } }
    @keyframes cf2 { from { transform: translateX(-64px) } to { transform: translateX(24px) } }
    @keyframes gl1 { from { transform: translate(0, 0) } to { transform: translate(20px, -10px) } }
    @keyframes gl2 { from { transform: translate(16px, -8px) } to { transform: translate(0, 0) } }
    @keyframes wing1 { 0%, 100% { opacity: 1 } 50% { opacity: .1 } }
    @keyframes wing2 { 0%, 100% { opacity: .1 } 50% { opacity: 1 } }
    @keyframes jump { 0% { transform: translate(0, 220px) rotate(0deg) } 15% { transform: translate(12px, 192px) rotate(-8deg) } 30% { transform: translate(24px, 176px) rotate(8deg) } 50% { transform: translate(40px, 184px) rotate(0deg) } 100% { transform: translate(80px, 260px) rotate(0deg); opacity: 0 } }
    .s1 { animation: s1 9s linear infinite }
    .s2 { animation: s2 11s linear infinite }
    .f1 { animation: f1 9s linear infinite }
    .f2 { animation: f2 11s linear infinite }
    .boat { animation: boat 3.4s ease-in-out infinite; transform-origin: 150px 236px; transform-box: fill-box }
    .cf1 { animation: cf1 28s linear infinite }
    .cf2 { animation: cf2 32s linear infinite }
    .gl1 { animation: gl1 2.6s ease-in-out infinite alternate }
    .gl2 { animation: gl2 3s ease-in-out infinite alternate }
    .wing1 { animation: wing1 .7s steps(1) infinite }
    .wing2 { animation: wing2 .7s steps(1) infinite }
    .jump { animation: jump 6s ease-in-out infinite }
  </style>
